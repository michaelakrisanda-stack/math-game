<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Blast! 🚀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg1: #1a1c4e;
    --bg2: #2d1b69;
    --card: #ffffff;
    --purple: #7c3aed;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #facc15;
    --blue: #3b82f6;
    --orange: #f97316;
    --pink: #ec4899;
  }

  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1f2937;
    overflow-x: hidden;
  }

  .stars-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .stars-bg span { position: absolute; color: rgba(255,255,255,.5); animation: twinkle 3s infinite alternate; }
  @keyframes twinkle { from { opacity: .2; } to { opacity: .9; } }

  .screen {
    position: relative;
    z-index: 1;
    width: min(560px, 94vw);
    background: var(--card);
    border-radius: 28px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    text-align: center;
    margin: 20px 0;
  }

  h1 { font-size: 2.2rem; color: var(--purple); margin-bottom: 6px; }
  .subtitle { color: #6b7280; margin-bottom: 22px; font-size: 1.05rem; }

  .hidden { display: none !important; }

  /* ---------- Menu buttons ---------- */
  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .topic-btn {
    border: none; border-radius: 20px; padding: 18px 10px;
    font-family: inherit; font-size: 1.15rem; font-weight: bold; color: #fff;
    cursor: pointer; transition: transform .12s, box-shadow .12s;
    box-shadow: 0 6px 0 rgba(0,0,0,.22);
  }
  .topic-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  .topic-btn .emoji { display: block; font-size: 2rem; margin-bottom: 6px; }
  .t-add   { background: var(--green); }
  .t-sub   { background: var(--blue); }
  .t-miss  { background: var(--orange); }
  .t-comp  { background: var(--pink); }
  .t-skip  { background: var(--purple); }
  .t-mix   { background: linear-gradient(135deg, var(--green), var(--blue), var(--purple)); grid-column: 1 / -1; }

  .level-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
  .level-btn {
    border: 3px solid #d1d5db; background: #f9fafb; border-radius: 999px;
    padding: 10px 20px; font-family: inherit; font-size: 1rem; font-weight: bold;
    cursor: pointer; color: #374151;
  }
  .level-btn.selected { border-color: var(--purple); background: #ede9fe; color: var(--purple); }
  .level-label { color: #6b7280; margin-bottom: 10px; font-size: .95rem; }

  /* ---------- Game screen ---------- */
  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
  .hud .pill {
    background: #f3f4f6; border-radius: 999px; padding: 8px 16px;
    font-weight: bold; font-size: 1rem; color: #374151; white-space: nowrap;
  }
  .hud .streak { color: var(--orange); }
  .back-btn {
    border: none; background: #f3f4f6; border-radius: 999px; padding: 8px 14px;
    font-family: inherit; font-size: 1rem; cursor: pointer; color: #374151; font-weight: bold;
  }

  .progress-track { background: #e5e7eb; border-radius: 999px; height: 14px; margin-bottom: 18px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, var(--green), var(--yellow)); height: 100%; width: 0%; border-radius: 999px; transition: width .4s; }

  .question-box {
    background: #f5f3ff; border-radius: 22px; padding: 26px 14px; margin-bottom: 18px;
    min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .question-text { font-size: 2.6rem; font-weight: bold; color: #1f2937; letter-spacing: 2px; }
  .question-hint { font-size: 1rem; color: #7c3aed; margin-top: 8px; }

  .hint-btn {
    border: none; border-radius: 999px; padding: 10px 22px; margin-top: 12px;
    font-family: inherit; font-size: 1rem; font-weight: bold; color: #92400e;
    background: var(--yellow); cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
    transition: transform .12s, box-shadow .12s;
  }
  .hint-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .hint-btn:disabled { opacity: .45; cursor: default; }
  .hint-text {
    margin-top: 12px; background: #fef9c3; border: 2px dashed #f59e0b;
    border-radius: 14px; padding: 12px 14px; font-size: 1.05rem; color: #92400e;
    line-height: 1.4; animation: hintIn .3s;
  }
  @keyframes hintIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .answer-btn {
    border: none; border-radius: 18px; padding: 20px 8px;
    font-family: inherit; font-size: 1.7rem; font-weight: bold; color: #fff;
    background: var(--blue); cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.22);
    transition: transform .12s, box-shadow .12s, background .2s;
  }
  .answer-btn:nth-child(2) { background: var(--purple); }
  .answer-btn:nth-child(3) { background: var(--orange); }
  .answer-btn:nth-child(4) { background: var(--pink); }
  .answer-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  .answer-btn.correct { background: var(--green) !important; animation: pop .4s; }
  .answer-btn.wrong { background: var(--red) !important; animation: shake .4s; }
  .answer-btn:disabled { cursor: default; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

  .feedback { min-height: 34px; margin-top: 14px; font-size: 1.3rem; font-weight: bold; }
  .feedback.good { color: var(--green); }
  .feedback.bad { color: var(--red); }

  /* ---------- Results ---------- */
  .big-emoji { font-size: 4.5rem; margin-bottom: 10px; }
  .result-score { font-size: 1.5rem; margin-bottom: 8px; color: #1f2937; }
  .result-stars { font-size: 2.6rem; margin-bottom: 12px; letter-spacing: 6px; }
  .result-msg { color: #6b7280; margin-bottom: 22px; font-size: 1.1rem; }
  .play-again {
    border: none; border-radius: 999px; padding: 16px 34px;
    font-family: inherit; font-size: 1.25rem; font-weight: bold; color: #fff;
    background: var(--green); cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.22); margin: 6px;
  }
  .menu-btn2 { background: var(--purple); }
  .play-again:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }

  .best-banner { background: #fef9c3; border-radius: 14px; padding: 10px; margin-bottom: 16px; font-weight: bold; color: #92400e; }

  /* confetti */
  .confetti { position: fixed; top: -20px; font-size: 1.6rem; z-index: 50; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 420px) {
    .question-text { font-size: 2rem; }
    .answer-btn { font-size: 1.4rem; padding: 16px 6px; }
  }
</style>
</head>
<body>

<div class="stars-bg" id="starsBg"></div>

<!-- ============ MENU ============ -->
<div class="screen" id="menuScreen">
  <h1>🚀 Math Blast!</h1>
  <p class="subtitle">Pick a mission, space cadet!</p>

  <div class="topic-grid">
    <button class="topic-btn t-add" data-topic="add"><span class="emoji">➕</span>Addition</button>
    <button class="topic-btn t-sub" data-topic="sub"><span class="emoji">➖</span>Subtraction</button>
    <button class="topic-btn t-miss" data-topic="missing"><span class="emoji">❓</span>Missing Number</button>
    <button class="topic-btn t-comp" data-topic="compare"><span class="emoji">⚖️</span>Bigger or Smaller</button>
    <button class="topic-btn t-mix" data-topic="mix"><span class="emoji">🌟</span>Super Mix (Everything!)</button>
  </div>

  <p class="level-label">How tricky?</p>
  <div class="level-row">
    <button class="level-btn selected" data-level="1">🐣 Easy</button>
    <button class="level-btn" data-level="2">🦊 Medium</button>
    <button class="level-btn" data-level="3">🐉 Hard</button>
  </div>

  <div id="bestBanner" class="best-banner hidden"></div>
</div>

<!-- ============ GAME ============ -->
<div class="screen hidden" id="gameScreen">
  <div class="hud">
    <button class="back-btn" id="quitBtn">🏠 Menu</button>
    <span class="pill">⭐ <span id="scoreVal">0</span></span>
    <span class="pill streak">🔥 <span id="streakVal">0</span></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="question-box">
    <div class="question-text" id="questionText"></div>
    <div class="question-hint" id="questionHint"></div>
    <button class="hint-btn" id="hintBtn">💡 Hint</button>
    <div class="hint-text hidden" id="hintText"></div>
  </div>

  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
</div>

<!-- ============ RESULTS ============ -->
<div class="screen hidden" id="resultScreen">
  <div class="big-emoji" id="resultEmoji">🏆</div>
  <div class="result-score" id="resultScore"></div>
  <div class="result-stars" id="resultStars"></div>
  <p class="result-msg" id="resultMsg"></p>
  <button class="play-again" id="againBtn">Play Again! 🔁</button>
  <button class="play-again menu-btn2" id="menuBtn">Menu 🏠</button>
</div>

<script>
(function () {
  "use strict";

  var QUESTIONS_PER_ROUND = 10;

  // ---------- helpers ----------
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function $(id) { return document.getElementById(id); }

  // ---------- background stars ----------
  (function makeStars() {
    var bg = $("starsBg");
    for (var i = 0; i < 40; i++) {
      var s = document.createElement("span");
      s.textContent = Math.random() < 0.3 ? "✦" : "·";
      s.style.left = Math.random() * 100 + "vw";
      s.style.top = Math.random() * 100 + "vh";
      s.style.fontSize = (10 + Math.random() * 14) + "px";
      s.style.animationDelay = (Math.random() * 3) + "s";
      bg.appendChild(s);
    }
  })();

  // ---------- sounds (no files needed) ----------
  var audioCtx = null;
  function beep(freq, dur, type, when) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var t = audioCtx.currentTime + (when || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* sound is optional */ }
  }
  function soundCorrect() { beep(523, .15); beep(659, .15, "sine", .1); beep(784, .25, "sine", .2); }
  function soundWrong() { beep(200, .3, "square"); }
  function soundWin() { [523, 587, 659, 784, 1047].forEach(function (f, i) { beep(f, .2, "sine", i * .12); }); }

  // ---------- question generators ----------
  // level 1: easy (within 20), level 2: within 100 no regrouping, level 3: within 100 with regrouping
  function genAdd(level) {
    var a, b;
    if (level === 1) { a = rand(1, 10); b = rand(1, 10); }
    else if (level === 2) {
      // build digits so the ones never carry (no regrouping)
      var aOnes = rand(0, 8), bOnes = rand(aOnes === 0 ? 1 : 0, 9 - aOnes);
      var aTens = rand(1, 7), bTens = rand(1, 8 - aTens);
      a = aTens * 10 + aOnes;
      b = bTens * 10 + bOnes;
    }
    else { a = rand(15, 79); b = rand(6, 99 - a); }
    return { text: a + " + " + b + " = ?", answer: a + b, hint: "", type: "add", a: a, b: b };
  }

  function genSub(level) {
    var a, b;
    if (level === 1) { a = rand(5, 20); b = rand(1, a - 1); }
    else if (level === 2) {
      // build digits so no borrowing is needed
      var aOnes = rand(1, 9), bOnes = rand(0, aOnes);
      var aTens = rand(2, 9), bTens = rand(1, aTens - 1);
      a = aTens * 10 + aOnes;
      b = bTens * 10 + bOnes;
    }
    else { a = rand(30, 99); b = rand(11, a - 5); }
    return { text: a + " − " + b + " = ?", answer: a - b, hint: "", type: "sub", a: a, b: b };
  }

  function genMissing(level) {
    var base = level === 1 ? genAdd(1) : (Math.random() < 0.5 ? genAdd(level) : genSub(level));
    var a = base.a, b = base.b, c = base.answer;
    var op = base.type === "add" ? "+" : "−";
    var hideFirst = Math.random() < 0.5;
    return {
      text: hideFirst ? "❓ " + op + " " + b + " = " + c : a + " " + op + " ❓ = " + c,
      answer: hideFirst ? a : b,
      hint: "What number goes in the box?",
      type: "missing", op: op, hideFirst: hideFirst, a: a, b: b, c: c
    };
  }

  function genCompare(level) {
    var max = level === 1 ? 20 : level === 2 ? 100 : 999;
    var a = rand(1, max), b = rand(1, max);
    if (level === 3 && Math.random() < 0.3) b = a; // sometimes equal on hard
    var answer = a > b ? ">" : a < b ? "<" : "=";
    return {
      text: a + "  ?  " + b,
      answer: answer,
      hint: "Pick the right sign!",
      choices: [">", "<", "="],
      compare: true,
      type: "compare", a: a, b: b
    };
  }

  function genSkip(level) {
    var steps = level === 1 ? [2, 5, 10] : level === 2 ? [2, 3, 5, 10] : [3, 4, 25, 100];
    var step = steps[rand(0, steps.length - 1)];
    var start = step * rand(1, level === 3 ? 8 : 4);
    var seq = [start, start + step, start + step * 2];
    return {
      text: seq.join(", ") + ", ❓",
      answer: start + step * 3,
      hint: "Keep counting by " + step + "s!",
      type: "skip", step: step, last: start + step * 2
    };
  }

  // ---------- hints: teach the strategy, never reveal the answer ----------
  function tens(n) { return Math.floor(n / 10) * 10; }
  function ones(n) { return n % 10; }

  function getHint(q) {
    if (q.type === "add") {
      if (q.a <= 10 && q.b <= 10) {
        var big = Math.max(q.a, q.b), small = Math.min(q.a, q.b);
        return "Start at " + big + " and count up " + small + " more on your fingers!";
      }
      if (ones(q.a) === 0 && ones(q.b) === 0) {
        return "Both numbers are tens! Think small: what is " + (q.a / 10) + " + " + (q.b / 10) + "? Now say it in tens!";
      }
      if (ones(q.a) + ones(q.b) > 9) {
        return "The ones make more than 9! Add the tens first (" + tens(q.a) + " + " + tens(q.b) + "), then add the ones (" + ones(q.a) + " + " + ones(q.b) + "), and put the two together.";
      }
      return "Break it into tens and ones! Add the tens (" + tens(q.a) + " + " + tens(q.b) + "), then add the ones (" + ones(q.a) + " + " + ones(q.b) + ").";
    }
    if (q.type === "sub") {
      if (q.a <= 20) {
        return "Start at " + q.a + " and hop backwards " + q.b + " times!";
      }
      if (ones(q.b) === 0) {
        return q.b + " is just tens! Start at " + q.a + " and count backwards by 10, " + (q.b / 10) + " times.";
      }
      if (ones(q.b) > ones(q.a)) {
        return "Tricky one — you need to borrow! Try it in two hops: first do " + q.a + " − " + tens(q.b) + ", then take away " + ones(q.b) + " more.";
      }
      return "Take away the tens first: " + q.a + " − " + tens(q.b) + ". Then take away " + ones(q.b) + " more.";
    }
    if (q.type === "missing") {
      if (q.op === "+") {
        var known = q.hideFirst ? q.b : q.a;
        return "The box and " + known + " must add up to " + q.c + ". Count up from " + known + " to " + q.c + " — how many hops did you take?";
      }
      if (q.hideFirst) {
        return "Work backwards! The box lost " + q.b + " and became " + q.c + ". Put the " + q.b + " back by adding it to " + q.c + ".";
      }
      return "Find the gap! Count up from " + q.c + " to " + q.a + " — the number of hops is your answer.";
    }
    if (q.type === "compare") {
      var da = String(q.a).length, db = String(q.b).length;
      if (da !== db) return "Count the digits! A number with more digits is always bigger. Remember: the open mouth eats the bigger number!";
      return "Compare the front digits first! If they match, look at the next digit. The open mouth always eats the bigger number.";
    }
    if (q.type === "skip") {
      return "Each number jumps up by " + q.step + ". Make one more jump of " + q.step + " starting from " + q.last + "!";
    }
    return "Take your time — you've got this!";
  }

  var GENERATORS = {
    add: genAdd,
    sub: genSub,
    missing: genMissing,
    compare: genCompare,
    skip: genSkip
  };

  function makeQuestion(topic, level) {
    var gen;
    if (topic === "mix") {
      var keys = ["add", "sub", "missing", "compare", "skip"];
      gen = GENERATORS[keys[rand(0, keys.length - 1)]];
    } else {
      gen = GENERATORS[topic];
    }
    return gen(level);
  }

  function makeChoices(q) {
    if (q.choices) return shuffle(q.choices.slice());
    var set = {};
    set[q.answer] = true;
    var choices = [q.answer];
    var guard = 0;
    while (choices.length < 4 && guard++ < 200) {
      var delta = rand(1, 10);
      var wrong = Math.random() < 0.5 ? q.answer + delta : q.answer - delta;
      if (Math.random() < 0.25) wrong = q.answer + (Math.random() < 0.5 ? 10 : -10); // classic place-value slip
      if (wrong >= 0 && !set[wrong]) { set[wrong] = true; choices.push(wrong); }
    }
    return shuffle(choices);
  }

  // ---------- state ----------
  var state = {
    topic: "add",
    level: 1,
    qIndex: 0,
    score: 0,
    streak: 0,
    bestStreak: 0,
    correctCount: 0,
    current: null,
    locked: false,
    hintUsed: false
  };

  var PRAISE = ["Awesome! 🎉", "You got it! ⭐", "Super! 🚀", "Brainpower! 🧠", "Amazing! 🌟", "Way to go! 🥳"];
  var ENCOURAGE = ["Almost! You'll get the next one! 💪", "Good try! Keep going! 🌈", "Oops! You can do it! 🐢"];

  var TOPIC_NAMES = {
    add: "Addition", sub: "Subtraction", missing: "Missing Number",
    compare: "Bigger or Smaller", skip: "Skip Counting", mix: "Super Mix"
  };

  // ---------- high scores (saved on this computer) ----------
  function bestKey() { return "mathblast-best-" + state.topic + "-" + state.level; }
  function loadBest() { try { return parseInt(localStorage.getItem(bestKey()) || "0", 10); } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} }

  // ---------- screens ----------
  function show(id) {
    ["menuScreen", "gameScreen", "resultScreen"].forEach(function (s) {
      $(s).classList.toggle("hidden", s !== id);
    });
  }

  // ---------- game flow ----------
  function startGame() {
    state.qIndex = 0;
    state.score = 0;
    state.streak = 0;
    state.bestStreak = 0;
    state.correctCount = 0;
    show("gameScreen");
    nextQuestion();
  }

  function nextQuestion() {
    if (state.qIndex >= QUESTIONS_PER_ROUND) { endGame(); return; }
    state.locked = false;
    state.hintUsed = false;
    state.current = makeQuestion(state.topic, state.level);
    $("questionText").textContent = state.current.text;
    $("questionHint").textContent = state.current.hint || "";
    $("hintBtn").disabled = false;
    $("hintText").classList.add("hidden");
    $("hintText").textContent = "";
    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    $("progressFill").style.width = (state.qIndex / QUESTIONS_PER_ROUND * 100) + "%";
    $("scoreVal").textContent = state.score;
    $("streakVal").textContent = state.streak;

    var answersEl = $("answers");
    answersEl.innerHTML = "";
    makeChoices(state.current).forEach(function (choice) {
      var btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = choice;
      btn.addEventListener("click", function () { pickAnswer(btn, choice); });
      answersEl.appendChild(btn);
    });
  }

  function pickAnswer(btn, choice) {
    if (state.locked) return;
    state.locked = true;
    var correct = String(choice) === String(state.current.answer);
    var buttons = $("answers").querySelectorAll("button");
    buttons.forEach(function (b) { b.disabled = true; });

    var fb = $("feedback");
    if (correct) {
      btn.classList.add("correct");
      state.correctCount++;
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      var points = (state.hintUsed ? 5 : 10) + (state.streak >= 3 ? 5 : 0);
      state.score += points;
      fb.textContent = PRAISE[rand(0, PRAISE.length - 1)] + (state.streak >= 3 ? " 🔥 Streak bonus!" : "");
      fb.classList.add("good");
      soundCorrect();
      sprinkleConfetti(8);
    } else {
      btn.classList.add("wrong");
      state.streak = 0;
      // show the right one
      buttons.forEach(function (b) {
        if (String(b.textContent) === String(state.current.answer)) b.classList.add("correct");
      });
      fb.textContent = ENCOURAGE[rand(0, ENCOURAGE.length - 1)];
      fb.classList.add("bad");
      soundWrong();
    }
    $("scoreVal").textContent = state.score;
    $("streakVal").textContent = state.streak;

    state.qIndex++;
    setTimeout(nextQuestion, correct ? 1000 : 1800);
  }

  function endGame() {
    $("progressFill").style.width = "100%";
    var pct = state.correctCount / QUESTIONS_PER_ROUND;
    var stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.4 ? 1 : 0;

    $("resultEmoji").textContent = stars === 3 ? "🏆" : stars === 2 ? "🎉" : stars === 1 ? "😊" : "💪";
    $("resultScore").textContent = "You got " + state.correctCount + " out of " + QUESTIONS_PER_ROUND + "! (" + state.score + " points)";
    $("resultStars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);

    var msgs = [
      "Keep practicing — every try makes your brain stronger!",
      "Nice work! Try again to earn more stars!",
      "Great job! Can you beat your score?",
      "WOW! You're a math superstar! 🌟"
    ];
    var msg = msgs[stars];
    var best = loadBest();
    if (state.score > best) {
      saveBest(state.score);
      msg = "🎊 NEW HIGH SCORE for " + TOPIC_NAMES[state.topic] + "! 🎊";
      sprinkleConfetti(40);
      soundWin();
    } else if (stars >= 2) {
      sprinkleConfetti(25);
      soundWin();
    }
    $("resultMsg").textContent = msg;
    show("resultScreen");
  }

  // ---------- confetti ----------
  var CONFETTI = ["🎉", "⭐", "✨", "🌟", "🎊", "💫"];
  function sprinkleConfetti(n) {
    for (var i = 0; i < n; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.textContent = CONFETTI[rand(0, CONFETTI.length - 1)];
      c.style.left = Math.random() * 100 + "vw";
      c.style.animationDuration = (1.5 + Math.random() * 2) + "s";
      c.style.animationDelay = (Math.random() * .5) + "s";
      document.body.appendChild(c);
      setTimeout(function (el) { return function () { el.remove(); }; }(c), 4500);
    }
  }

  // ---------- wire up menu ----------
  document.querySelectorAll(".level-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".level-btn").forEach(function (b) { b.classList.remove("selected"); });
      btn.classList.add("selected");
      state.level = parseInt(btn.dataset.level, 10);
      updateBestBanner();
    });
  });

  document.querySelectorAll(".topic-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.topic = btn.dataset.topic;
      startGame();
    });
  });

  function updateBestBanner() {
    // show best score across the selected level for fun
    var banner = $("bestBanner");
    var any = 0;
    ["add", "sub", "missing", "compare", "skip", "mix"].forEach(function (t) {
      try {
        var v = parseInt(localStorage.getItem("mathblast-best-" + t + "-" + state.level) || "0", 10);
        if (v > any) any = v;
      } catch (e) {}
    });
    if (any > 0) {
      banner.textContent = "🏅 Best score at this level: " + any + " points";
      banner.classList.remove("hidden");
    } else {
      banner.classList.add("hidden");
    }
  }
  updateBestBanner();

  $("hintBtn").addEventListener("click", function () {
    if (state.locked || !state.current) return;
    state.hintUsed = true;
    $("hintBtn").disabled = true;
    $("hintText").textContent = "💡 " + getHint(state.current);
    $("hintText").classList.remove("hidden");
    beep(880, .12); beep(1175, .18, "sine", .1);
  });

  $("quitBtn").addEventListener("click", function () { show("menuScreen"); updateBestBanner(); });
  $("againBtn").addEventListener("click", startGame);
  $("menuBtn").addEventListener("click", function () { show("menuScreen"); updateBestBanner(); });
})();
</script>
</body>
</html>
